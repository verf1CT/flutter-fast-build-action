name: Test Action

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create dummy app
        run: |
          flutter create dummy_app
          mv dummy_app/* .
          mv dummy_app/.[!.]* .
          rmdir dummy_app

      - name: Run fast build action
        uses: ./
        with:
          target: 'apk'
          run-build-runner: 'false'
