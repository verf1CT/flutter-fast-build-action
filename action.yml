name: 'Flutter Fast Build'
description: 'Builds a Flutter project with intelligent caching and error reporting.'
branding:
  icon: 'smartphone'
  color: 'blue'
inputs:
  target:
    description: 'The target to build (apk, ios, web)'
    required: true
    default: 'apk'
  flutter-version:
    description: 'Flutter version to use'
    required: false
    default: 'stable'
runs:
  using: 'composite'
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: 'stable'
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Analyze code
      shell: bash
      run: flutter analyze

    - name: Run tests
      shell: bash
      run: flutter test --coverage

    - name: Build target
      shell: bash
      run: flutter build ${{ inputs.target }}
