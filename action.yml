name: 'Flutter Fast Build'
description: 'Builds a Flutter project with intelligent caching, build_runner support, and error reporting.'
branding:
  icon: 'smartphone'
  color: 'blue'
inputs:
  target:
    description: 'The target to build (apk, appbundle, ios, web, windows, macos, linux)'
    required: true
    default: 'apk'
  flutter-version:
    description: 'Flutter version to use'
    required: false
    default: 'stable'
  run-build-runner:
    description: 'Whether to run build_runner (true/false)'
    required: false
    default: 'false'
  build-args:
    description: 'Additional arguments for flutter build (e.g. --release --flavor prod)'
    required: false
    default: ''
  upload-artifact:
    description: 'Whether to upload the build output as a GitHub artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'flutter-build'
runs:
  using: 'composite'
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: 'stable'
        cache: true

    - name: Install dependencies
      shell: bash
      run: |
        echo "📦 Installing dependencies..."
        flutter pub get

    - name: Cache build_runner
      if: ${{ inputs.run-build-runner == 'true' }}
      uses: actions/cache@v3
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-runner-

    - name: Run build_runner
      if: ${{ inputs.run-build-runner == 'true' }}
      shell: bash
      run: |
        echo "⚙️ Running build_runner..."
        dart run build_runner build --delete-conflicting-outputs

    - name: Analyze code
      shell: bash
      run: |
        echo "🔍 Analyzing code..."
        flutter analyze

    - name: Run tests
      shell: bash
      run: |
        echo "🧪 Running tests..."
        flutter test --coverage

    - name: Build target
      shell: bash
      run: |
        echo "🚀 Building ${{ inputs.target }}..."
        flutter build ${{ inputs.target }} ${{ inputs.build-args }}

    - name: Upload Artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/bundle/release/*.aab
          build/ios/iphoneos/*.app
          build/web/
          build/windows/runner/Release/
          build/macos/Build/Products/Release/
          build/linux/x64/release/bundle/
