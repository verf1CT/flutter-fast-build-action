name: 'Flutter Fast Build'
description: 'Builds a Flutter project with intelligent caching, build_runner support, and error reporting.'
branding:
  icon: 'smartphone'
  color: 'blue'
inputs:
  target:
    description: 'The target to build (apk, appbundle, ios, web, windows, macos, linux)'
    required: true
    default: 'apk'
  flutter-version:
    description: 'Flutter version to use'
    required: false
    default: 'any'
  run-build-runner:
    description: 'Whether to run build_runner (true/false)'
    required: false
    default: 'false'
  build-args:
    description: 'Additional arguments for flutter build (e.g. --release --flavor prod)'
    required: false
    default: ''
  upload-artifact:
    description: 'Whether to upload the build output as a GitHub artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'flutter-build'
  firebase-app-id:
    description: 'Firebase App ID for Distribution'
    required: false
  firebase-token:
    description: 'Firebase CLI token for Distribution'
    required: false
  firebase-testers:
    description: 'Comma separated list of tester emails or groups'
    required: false
    default: 'qa-team'
  ios-asc-key:
    description: 'App Store Connect API Key (JSON string) for Fastlane'
    required: false
  google-play-key:
    description: 'Google Play Service Account JSON string for Fastlane'
    required: false
  monorepo:
    description: 'Whether this is a monorepo (if true, only discovers apps and outputs matrix)'
    required: false
    default: 'false'
outputs:
  matrix:
    description: 'JSON array of discovered flutter apps'
    value: ${{ steps.discover.outputs.matrix }}
runs:
  using: 'composite'
  steps:
    - name: Discover apps
      id: discover
      if: ${{ inputs.monorepo == 'true' }}
      shell: bash
      run: |
        echo "🔍 Discovering Flutter apps..."
        chmod +x ${{ github.action_path }}/discover_apps.sh
        ${{ github.action_path }}/discover_apps.sh

    - name: Set up Flutter
      if: ${{ inputs.monorepo != 'true' }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: 'stable'
        cache: true

    - name: Install dependencies
      if: ${{ inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo "📦 Installing dependencies..."
        flutter pub get

    - name: Cache build_runner
      if: ${{ inputs.run-build-runner == 'true' && inputs.monorepo != 'true' }}
      uses: actions/cache@v3
      with:
        path: |
          .dart_tool
          build
        key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-runner-

    - name: Run build_runner
      if: ${{ inputs.run-build-runner == 'true' && inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo "⚙️ Running build_runner..."
        dart run build_runner build --delete-conflicting-outputs

    - name: Analyze code
      if: ${{ inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo "🔍 Analyzing code..."
        flutter analyze

    - name: Run tests
      if: ${{ inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo "🧪 Running tests..."
        flutter test --coverage

    - name: Build target
      if: ${{ inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo "🚀 Building ${{ inputs.target }}..."
        flutter build ${{ inputs.target }} ${{ inputs.build-args }}

    - name: Upload Artifact
      if: ${{ inputs.upload-artifact == 'true' && inputs.monorepo != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/bundle/release/*.aab
          build/ios/iphoneos/*.app
          build/web/
          build/windows/runner/Release/
          build/linux/x64/release/bundle/

    - name: Upload to Firebase App Distribution
      if: ${{ inputs.firebase-app-id != '' && inputs.firebase-token != '' && inputs.monorepo != 'true' }}
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ inputs.firebase-app-id }}
        token: ${{ inputs.firebase-token }}
        groups: ${{ inputs.firebase-testers }}
        file: build/app/outputs/flutter-apk/app-release.apk

    - name: Deploy to Google Play via Fastlane
      if: ${{ inputs.google-play-key != '' && (inputs.platform == 'android' || inputs.platform == 'all') && inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo '${{ inputs.google-play-key }}' > play_config.json
        cd android
        fastlane supply --aab ../build/app/outputs/bundle/release/app-release.aab --json_key ../play_config.json --track production

    - name: Deploy to TestFlight/App Store via Fastlane
      if: ${{ inputs.ios-asc-key != '' && (inputs.platform == 'ios' || inputs.platform == 'all') && inputs.monorepo != 'true' }}
      shell: bash
      run: |
        echo '${{ inputs.ios-asc-key }}' > asc_key.json
        cd ios
        fastlane deliver --ipa ../build/ios/iphoneos/*.ipa --api_key_path ../asc_key.json
